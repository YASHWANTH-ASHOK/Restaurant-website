    <!-- fontawsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- googlefont -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Saira:ital,wght@0,100..900;1,100..900&display=swap"

</head>

<body>
    <div class="navbar">
        <a href="index.html" class="brand"><span> <i class="fa-solid fa-utensils"></i></span> Smoke nd Sip</a>
        <div class="nav-container">
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="hamburger-lines">
                <i class="fa-solid fa-bars"></i>
            </label>
            <ul class="navlinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="recipe.html">Recipe</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </div>

    <!-- contact form  -->

    <div class="contact-page">
            
        <h1 class="contact-title">Get in Touch</h1>
        <p class="contact-description">Have a question or want to reserve a table? Drop us a line.</p>

        <div class="contact-container">
            <form class="contact-form">
                <div class="form-details">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-details">
                    <label>Email id</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-details">
                    <label>Message</label>
                    <textarea rows="5" cols="84" type="text" placeholder="How can we help you?" required></textarea>

                    <button id="message-button">SEND MESSAGE</button>
                </div>
            </form>

            <div class="contact-info-panel">
                <div class="info-item">
                    <h4>Location</h4>
                    <p>Kakkanad, Kochi, Kerala, India</p>
                </div>
                <div class="info-item">
                    <h4>Opening Hours</h4>
                    <p>Monday - Sunday: 12:00 PM - 11:00 PM</p>
                </div>
            </div>
        </div>

         <div class="containerText">
                <h3 class="contentHead">Contact Us</h3>
                <p>+91-35787872</p>
                <p>smokendsip@gmail.com</p>
                <div class="socialIcons">
                    <a class="smLink" href="https://www.facebook.com/" target="_blank">
                        <i class="fa-brands fa-square-facebook"></i>
                    </a>

                    <a class="smLink" href="https://maps.google.com/" target="_blank">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a class="smLink" href="https://www.instagram.com/accounts/login/?hl=en" target="_blank">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </div>
            </div>

        
    </div>


</body>
</html>
